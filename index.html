const WEDDING_DATE = new Date('2026-09-05');
// порядок сортировки статей: забронировано, запланировано, оплачено, подарок, отменено
function statusRank(c){
  if(c.isGift) return 3;
  if(c.status==='cancelled') return 4;
  if(c.status==='booked') return 0;
  if(c.status==='planned') return 1;
  if(c.status==='paid') return 2;
  return 1;
}
// порядок сортировки категорий: требует выбора, частично, забронировано, оплачено
function catStatusRank(cs){ return {needs:0,partial:1,booked:2,paid:3,gifts:4}[cs]; }
const PAYDAYS=[10,25]; // числа поступления зарплаты, по 50%
// считает количество будущих поступлений и эквивалент в «месяцах» (по 2 поступления = 1 месяц)
// до даты свадьбы, начиная с «эффективной» даты (today либо later если уже изменены накопления)
function calcPaySchedule(fromDate, toDate){
  let events=0;
  const cur=new Date(fromDate.getFullYear(),fromDate.getMonth(),fromDate.getDate());
  const end=new Date(toDate.getFullYear(),toDate.getMonth(),toDate.getDate());
  let y=cur.getFullYear(), m=cur.getMonth();
  // идём по месяцам, считаем дни выплат строго ПОСЛЕ текущего дня и СТРОГО ДО свадьбы
  while(true){
    for(const pd of PAYDAYS){
      const d=new Date(y,m,pd);
      if(d>cur && d<end) events++;
    }
    if(y===end.getFullYear() && m===end.getMonth()) break;
    m++; if(m>11){m=0;y++;}
    if(y>end.getFullYear()+2) break; // страховка
  }
  const monthsEq=events/2; // 2 поступления = полный месяц
  return {events, monthsEq};
}

// единый набор тонких линейных иконок; цвет наследуется через currentColor

function normalizeData(d){
  (d.contractors||[]).forEach(c=>{
    if(typeof c.isPrepay==='undefined') c.isPrepay=(+c.paid>0&&+c.total>0&&+c.paid<+c.total);
    if(typeof c.isGift==='undefined') c.isGift=false;
  });
  if(!d.catIcons)d.catIcons={};
  if(!d.expandedCats)d.expandedCats={};
  return d;
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('wedding2026'));
    if(!d) return normalizeData(clone(DEFAULT_DATA));
    if(d.savings && !d.savingsList){
      d.savingsList=[
        {id:'s1',label:(d.savingsLabels&&d.savingsLabels.accumulative)||'Накопительный счёт',amount:+d.savings.accumulative||0},
        {id:'s2',label:(d.savingsLabels&&d.savingsLabels.roman)||'Вклад Романа',amount:+d.savings.roman||0},
        {id:'s3',label:(d.savingsLabels&&d.savingsLabels.nevesta)||'Вклад Елизаветы',amount:+d.savings.nevesta||0},
      ];
      d.nextSavId=4; delete d.savings; delete d.savingsLabels;
    }
    if(!d.savingsList) d.savingsList=clone(DEFAULT_DATA.savingsList);
    if(!d.nextSavId) d.nextSavId=(d.savingsList.length||0)+1;
    if(!d.contractors) d.contractors=clone(DEFAULT_DATA.contractors);

}

function groupNum(v){
  const n=(''+v).replace(/[^\d]/g,'');
  if(!n)return'';
  return n.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');
}
function rawNum(v){const n=(''+v).replace(/[^\d]/g,'');return n?+n:0;}
// конвертация дат: храним «дд.мм.гггг», поле date работает с «гггг-мм-дд»
function dmyToIso(dmy){
  if(!dmy)return'';
  const m=(''+dmy).match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(!m)return'';
  const d=m[1].padStart(2,'0'),mo=m[2].padStart(2,'0');
  return `${m[3]}-${mo}-${d}`;
}
function isoToDmy(iso){
  if(!iso)return'';
  const m=(''+iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m)return'';
  return `${m[3]}.${m[2]}.${m[1]}`;
}

// ── STATS ─────────────────────────────────────────────────
function calcStats(){
  const c=state.contractors;
  const active=c.filter(x=>!x.isGift && x.status!=='cancelled');
  const realBudget=active.reduce((s,x)=>{
    if(x.status==='booked'||x.status==='paid') return s+(+x.total||0);
    return s+(+x.planned||0);
  },0);
  const planned    =active.reduce((s,x)=>s+(+x.planned||0),0);
  const contracted =active.reduce((s,x)=>s+(+x.total||0),0);
  // paid — только активные (без подарков и отменённых), т.к. отменённые нигде не учитываются
  const paid=active.reduce((s,x)=>s+(+x.paid||0),0);
  const obligatedRemaining=active.filter(x=>x.status==='booked'||x.status==='paid').reduce((s,x)=>s+(+x.total||0)-(+x.paid||0),0);
  const plannedRemaining  =active.filter(x=>x.status==='planned').reduce((s,x)=>s+(+x.planned||0),0);
  // totalSav — деньги на счетах (ещё не потрачены)
  const totalSav=(state.savingsList||[]).reduce((s,x)=>s+(+x.amount||0),0);
  const giftTotal=c.filter(x=>x.isGift&&x.status!=='cancelled').reduce((s,x)=>s+((+x.paid||0)>0?(+x.paid):(+x.planned||0)),0);
  // накоплено + оплачено = всё что уже собрано/потрачено на свадьбу
  const savedPlusPaid=totalSav+paid;
  // ещё накопить = бюджет − оплачено − накоплено (оплаченное уже выведено и не лежит на счетах)
  const deficit=Math.max(0,realBudget-paid-totalSav);
  const freeAfterObligations=totalSav-obligatedRemaining;
  return{planned,realBudget,contracted,paid,obligatedRemaining,plannedRemaining,totalSav,giftTotal,savedPlusPaid,deficit,freeAfterObligations};
}

function renderDashboard(){
  const s=calcStats();
  const days=Math.max(1,Math.ceil((WEDDING_DATE-new Date())/86400000));
  const months=(days/30).toFixed(1);
  const monthly=s.deficit>0?Math.ceil(s.deficit/(days/30)):0;
  const base=s.realBudget||1;
  const pSav =Math.min(100,Math.round(s.totalSav/base*100));
  const pPaid=Math.min(100,Math.round(s.paid/base*100));
  const pCon =Math.min(100,Math.round(s.contracted/base*100));

  const catMap={};
  state.contractors.filter(c=>c.status!=='cancelled').forEach(c=>{
    if(!catMap[c.cat])catMap[c.cat]={total:0,paid:0,obligRem:0,plannedAmt:0,giftAmt:0,hasBooked:false,allPaid:true,hasNonGift:false,items:[],nNonGift:0,nBooked:0,nPlanned:0,nPaidOrGift:0};
    const m=catMap[c.cat];
    if(c.isGift){
      const gv=(+c.paid||0)>0?(+c.paid):(+c.planned||0);
      m.giftAmt+=gv;
      m.total+=gv;
      m.nPaidOrGift++;
    } else {
      m.hasNonGift=true;
      m.nNonGift++;
      const isComm=(c.status==='booked'||c.status==='paid');
      const amt=isComm?(+c.total||0):(+c.planned||0);
      m.total+=amt;
      m.paid+=+c.paid||0;
      if(isComm){m.hasBooked=true;m.obligRem+=(+c.total||0)-(+c.paid||0);}
      else{m.plannedAmt+=(+c.planned||0);}
      if(c.status!=='paid')m.allPaid=false;
      if(c.status==='paid')m.nPaidOrGift++;
      else if(c.status==='booked')m.nBooked++;
      else if(c.status==='planned')m.nPlanned++;
    }
    m.items.push(c);
  });

  // статус категории по п.3
  function categoryState(d){
    const totalItems=d.items.length;
    if(!d.hasNonGift) return 'gifts'; // только подарки
    // все статьи оплачены или подарены
    if(d.nPaidOrGift===totalItems) return 'paid';
    // все неподарочные забронированы (нет планируемых, нет неоплаченных вне брони)
    if(d.nPlanned===0 && d.nBooked>0) return 'booked';
    // все только планируются (ни одной брони/оплаты среди неподарочных)
    if(d.nBooked===0 && d.nPaidOrGift===0) return 'needs';
    // иначе — частично выполнено
    return 'partial';
  }
  const CAT_STATE_META={

// ── CONTRACTORS ───────────────────────────────────────────
function renderContractors(){
  const cats=['Все',...new Set(state.contractors.map(c=>c.cat))];
  const fc=state.filterCat||'Все';
  const filtered=(fc==='Все'?state.contractors:state.contractors.filter(c=>c.cat===fc)).slice().sort((a,b)=>statusRank(a)-statusRank(b));
  const chips=cats.map(c=>`<button class="cat-chip${fc===c?' active':''}" onclick="setFilter('${(c+'').replace(/'/g,"\\'")}')">${c}</button>`).join('');
  const cards=filtered.length?filtered.map(renderCard).join(''):'<div class="empty">Нет статей</div>';

  const activeFiltered=filtered.filter(c=>!c.isGift&&c.status!=='cancelled');
  const total_real=activeFiltered.reduce((s,c)=>s+((c.status==='booked'||c.status==='paid')?(+c.total||0):(+c.planned||0)),0);
  const total_paid=activeFiltered.reduce((s,c)=>s+(+c.paid||0),0);
  const total_oblRem=activeFiltered.filter(c=>c.status==='booked'||c.status==='paid').reduce((s,c)=>s+(+c.total||0)-(+c.paid||0),0);
  const total_planRem=activeFiltered.filter(c=>c.status==='planned').reduce((s,c)=>s+(+c.planned||0),0);
  const total_contracted=activeFiltered.filter(c=>c.status==='booked'||c.status==='paid').reduce((s,c)=>s+(+c.total||0),0);
  const total_gifts=filtered.filter(c=>c.isGift&&c.status!=='cancelled').reduce((s,c)=>s+((+c.paid||0)>0?(+c.paid):(+c.planned||0)),0);

  return`
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
    <div class="cat-filter" style="flex:1">${chips}</div>
    <button onclick="openCatManager()" style="flex-shrink:0;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,0.05);border:1px solid rgba(217,189,110,0.2);border-radius:20px;padding:5px 11px;color:var(--text3);cursor:pointer;font-size:11px;font-family:inherit;white-space:nowrap">${ic('list',13)} Катег.</button>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-stripe" style="background:var(--yellow)"></div>Обязательный остаток</div>
    <div class="legend-item"><div class="legend-stripe" style="background:rgba(95,104,120,0.6)"></div>Плановая оценка</div>
    <div class="legend-item"><div class="legend-stripe" style="background:var(--green)"></div>Оплачено</div>
  </div>
  ${cards}
  <div style="background:var(--bg2);border:1px solid rgba(217,189,110,0.2);border-radius:var(--radius);padding:14px 16px;margin-top:4px">
    <div style="font-size:9px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:12px">Итого${fc!=='Все'?' · '+fc:''}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
      <span style="font-size:11px;color:var(--text2)">Бюджет (договор / план)</span>
      <span style="font-size:13px;font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700">${fmtZ(total_real)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
      <span style="font-size:11px;color:var(--text2)">Договорная сумма (всего)</span>
      <span style="font-size:13px;font-variant-numeric:tabular-nums;color:var(--blue);font-weight:700">${total_contracted?fmtZ(total_contracted):'—'}</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
      <span style="font-size:11px;color:var(--text2)">Оплачено</span>
      <span style="font-size:13px;font-variant-numeric:tabular-nums;color:var(--green);font-weight:700">${fmtZ(total_paid)}</span>
    </div>
    <div style="padding:6px 0;border-bottom:${total_gifts?'1px solid rgba(255,255,255,0.05)':'none'}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px">${ic('lock',12)} Остаток обязательный</span>
        <span style="font-size:13px;font-variant-numeric:tabular-nums;color:var(--yellow);font-weight:700">${total_oblRem?fmtZ(total_oblRem):'—'}</span>
      </div>
      ${total_planRem?`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
        <span style="font-size:11px;color:var(--text3)">Остаток плановый</span>
        <span style="font-size:12px;font-variant-numeric:tabular-nums;color:var(--text3)">~ ${fmtZ(total_planRem)}</span>
      </div>`:''}
    </div>
    ${total_gifts?`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0">
      <span style="font-size:11px;color:var(--purple);display:flex;align-items:center;gap:4px">${ic('gift',12)} Подарки (вне бюджета)</span>
      <span style="font-size:12px;font-variant-numeric:tabular-nums;color:var(--purple)">${fmtZ(total_gifts)}</span>
    </div>`:''}
  </div>`;
}

function renderCard(c){
  const isGift=!!c.isGift;
  const chev=`<span style="color:var(--text3)" class="card-chevron">${ic('chevron',14)}</span>`;

  if(isGift){
    const gPaid=+c.paid||0, gPlan=+c.planned||0;
    let gMain;
    if(gPaid>0){
      // оплаченный подарок — основная сумма это оплата
      gMain=`<div class="card-amount" style="color:var(--purple)">${fmtZ(gPaid)}</div>
             <div class="card-amount-sub" style="color:var(--purple);opacity:0.8">оплачено</div>
             ${gPlan&&gPlan!==gPaid?`<div class="card-amount-sub" style="color:var(--text3);margin-top:3px">план ${fmtZ(gPlan)}</div>`:''}`;
    } else if(gPlan>0){
      gMain=`<div class="card-amount" style="color:var(--purple)">~ ${fmtZ(gPlan)}</div>
             <div class="card-amount-sub" style="color:var(--text3);opacity:0.8">план</div>`;
    } else { gMain=''; }
    return`
    <div class="contractor-card gift" onclick="openModal(${c.id})">
      <div class="card-header">
        <div class="card-icon" style="background:rgba(194,168,224,0.15);color:var(--purple)">${ic('gift',20)}</div>
        <div class="card-meta">
          <div class="card-name">${c.name}</div>
          <div class="card-cat">${c.cat}</div>
          <span class="status-badge" style="background:rgba(194,168,224,0.15);color:var(--purple)">${ic('gift',10)} Подарок · вне бюджета</span>
        </div>
        <div class="card-right">
          ${gMain}
          ${chev}
        </div>
      </div>
    </div>`;
  }

  if(c.status==='cancelled'){
    return`
    <div class="contractor-card cancelled" onclick="openModal(${c.id})">
      <div class="card-header">
        <div class="card-icon" style="background:rgba(226,145,127,0.1);color:var(--red)">${ic('close',18)}</div>
        <div class="card-meta">
          <div class="card-name" style="text-decoration:line-through;color:var(--text3)">${c.name}</div>
          <div class="card-cat">${c.cat}</div>
          <span class="status-badge" style="background:rgba(226,145,127,0.15);color:var(--red)">Отменено · вне бюджета</span>
        </div>
        <div class="card-right">
          ${+c.paid?`<div style="font-size:12px;color:var(--red);font-variant-numeric:tabular-nums">уплач. ${fmtZ(+c.paid)}</div>`:''}
          ${chev}
        </div>
      </div>
    </div>`;
  }

  const sc=STATUS[c.status]||STATUS.planned;
  const isCommitted=(c.status==='booked'||c.status==='paid');
  const isPaid=c.status==='paid';
  const total=+c.total||0, paidAmt=+c.paid||0, planAmt=+c.planned||0;
  const remainder=total-paidAmt;

  let cardClass, rightBlock;
  if(isPaid){
    // оплачено полностью — показываем полную сумму оплаты
    cardClass='all-paid';
    const full=total||paidAmt||planAmt;
    rightBlock=`
      <div class="card-amount" style="color:var(--green)">${fmtZ(full)}</div>
      <div class="card-amount-sub" style="color:var(--green);opacity:0.8">${ic('check',10)} оплачено</div>`;
  } else if(isCommitted){
    // забронировано — главное это остаток к оплате; ниже оплачено из договорной
    cardClass='committed';
    rightBlock=`
      <div class="card-amount" style="color:var(--yellow)">${fmtZ(remainder)}</div>
      <div class="card-amount-sub" style="color:var(--yellow);opacity:0.85">${ic('lock',10)} остаток</div>
      <div class="card-amount-sub" style="color:var(--text3);margin-top:3px">опл. ${fmtZ(paidAmt)} из ${fmtZ(total)}</div>`;
  } else {
    // не забронировано — плановая
    cardClass='only-planned';
    rightBlock=`
      <div class="card-amount" style="color:var(--text2)">~ ${fmtZ(planAmt)}</div>
      <div class="card-amount-sub" style="color:var(--text3);opacity:0.85">план</div>`;
  }

  return`
  <div class="contractor-card ${cardClass}" onclick="openModal(${c.id})">
    <div class="card-header">
      <div class="card-icon" style="background:${sc.bg};color:${sc.color}">${ic(catIcon(c.cat),20)}</div>
      <div class="card-meta">
        <div class="card-name">${c.name}</div>
        <div class="card-cat">${c.cat}</div>
        <span class="status-badge" style="background:${sc.bg};color:${sc.color}">${sc.label}</span>
      </div>
      <div class="card-right">
        ${rightBlock}
        ${chev}
      </div>
    </div>
  </div>`;
}

// ── SAVINGS TAB ───────────────────────────────────────────
function renderSavings(){
  const s=calcStats();
  const now=new Date();
  const days=Math.max(1,Math.ceil((WEDDING_DATE-now)/86400000));
  const months=(days/30).toFixed(1);
  // эффективная дата: если сегодня день зарплаты (10/25) и накопления ещё НЕ менялись сегодня,
  // то это поступление считается предстоящим (откатываем на день назад для расчёта)
  let effDate=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const isPayday=PAYDAYS.includes(now.getDate());
  if(isPayday){
    const lc=state.lastSavingsChange?new Date(state.lastSavingsChange):null;
    const changedToday=lc && lc.getFullYear()===now.getFullYear() && lc.getMonth()===now.getMonth() && lc.getDate()===now.getDate();
    if(!changedToday){ effDate=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1); }
  }
  const sched=calcPaySchedule(effDate, WEDDING_DATE);
  const perMonth=s.deficit>0 && sched.monthsEq>0 ? Math.ceil(s.deficit/sched.monthsEq) : (s.deficit>0?s.deficit:0);
  const perPay=s.deficit>0 && sched.events>0 ? Math.ceil(s.deficit/sched.events) : 0;
  const monthly=perMonth;
  const pct=Math.min(100,Math.round(s.savedPlusPaid/(s.realBudget||1)*100));
  const freeColor=s.freeAfterObligations>=0?'var(--green)':'var(--red)';

  const savRows=(state.savingsList||[]).map((sv,i)=>{
    const col=SAVINGS_COLORS[i%SAVINGS_COLORS.length];
    return`<div class="sav-row">
      <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
        <span class="sav-dot" style="background:${col}"></span>
        <span class="sav-label">${sv.label}</span>
      </div>
      <div class="sav-input-row">
        <span class="sav-val" style="color:${col}">${fmtZ(sv.amount)}</span>
        <button class="sav-edit-btn" onclick="openSavModal('${sv.id}')">${ic('edit',13)}</button>
        <button class="sav-edit-btn" style="color:var(--red);background:rgba(226,145,127,0.12)" onclick="deleteSav('${sv.id}')">${ic('close',13)}</button>
      </div>
    </div>`;
  }).join('');

  const payRowTpl=(accent)=>(c)=>{
    const rem=(+c.total||0)-(+c.paid||0);
    return`<div style="background:rgba(${accent},0.08);border:1px solid rgba(${accent},0.15);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-size:13px;color:var(--text)">${c.name}</div><div style="font-size:10px;color:var(--text3);margin-top:2px">${c.cat}</div></div>
      <div style="text-align:right">
        <div style="font-size:13px;color:rgb(${accent});font-variant-numeric:tabular-nums">+${fmtZ(+c.paid)}</div>
        ${rem>0?`<div style="font-size:10px;color:var(--yellow)">ост. ${fmtZ(rem)}</div>`:''}
      </div>
    </div>`;
  };
  const prepItems=state.contractors.filter(c=>+c.paid>0&&!c.isGift&&c.isPrepay);
  const paidItems=state.contractors.filter(c=>+c.paid>0&&!c.isGift&&!c.isPrepay);
  const sortByStatus=arr=>arr.slice().sort((a,b)=>statusRank(a)-statusRank(b));
  const prepSorted=sortByStatus(prepItems), paidSorted=sortByStatus(paidItems);
  const prepRows=prepSorted.map(payRowTpl('155,196,232')).join('')||'<div class="empty">Нет предоплат</div>';
  const payRows=paidSorted.map(payRowTpl('143,207,168')).join('')||'<div class="empty">Нет оплат</div>';
  const prepTotal=prepItems.reduce((x,c)=>x+(+c.paid||0),0);
  const paidTotal=paidItems.reduce((x,c)=>x+(+c.paid||0),0);

  const sectionTotal=(label,val,color)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px 0;margin-top:2px;border-top:1px solid rgba(255,255,255,0.08)">
    <span style="font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase">${label}</span>
    <span style="font-size:15px;font-weight:700;color:${color};font-variant-numeric:tabular-nums">${fmtZ(val)}</span>
  </div>`;

  const giftVal=c=>((+c.paid||0)>0?(+c.paid):(+c.planned||0));
  const giftItems=sortByStatus(state.contractors.filter(c=>c.isGift&&c.status!=='cancelled'));
  const giftTotalSav=giftItems.reduce((sv,c)=>sv+giftVal(c),0);
  const giftRows=giftItems.map(c=>{
    const gp=(+c.paid||0)>0;
    return`<div style="background:rgba(194,168,224,0.08);border:1px solid rgba(194,168,224,0.15);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
      <div style="min-width:0;flex:1"><div style="font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.name}</div><div style="font-size:10px;color:var(--text3);margin-top:2px">${c.cat} · ${gp?'оплачено':'план'}</div></div>
      <div style="font-size:13px;color:var(--purple);font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0">${giftVal(c)?fmtZ(giftVal(c)):'—'}</div>
    </div>`;
  }).join('');
  const giftBlock=giftItems.length?`
  <div class="section-head">${ic('gift',11)} Подарки · вне бюджета</div>
  ${giftRows}
  ${sectionTotal('Итого подарки',giftTotalSav,'var(--purple)')}`:'';

  return`
  <div class="savings-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="savings-title" style="margin:0">Источники накоплений</div>
      <button onclick="openSavModal(null)" style="display:flex;align-items:center;gap:4px;background:rgba(217,189,110,0.15);border:1px solid rgba(217,189,110,0.3);border-radius:8px;padding:5px 11px;color:var(--gold);cursor:pointer;font-size:12px;font-family:inherit">${ic('plus',13)} Добавить</button>
    </div>
    ${savRows||'<div class="empty" style="padding:16px 0">Нет источников</div>'}
    <div class="divider" style="margin:12px 0 8px"></div>
    <div class="sav-row">
      <span style="font-size:13px;color:var(--gold);font-weight:600">ИТОГО НАКОПЛЕНО</span>
      <span class="sav-val" style="color:var(--gold);font-size:18px">${fmtZ(s.totalSav)}</span>
    </div>
  </div>

  <div class="savings-card">
    <div class="savings-title">Сколько нужно накопить</div>
    <div class="need-block">
      <div class="need-row">
        <span class="need-label">Общий бюджет свадьбы</span>
        <span class="need-val" style="color:var(--text)">${fmtZ(s.realBudget)}</span>
      </div>
      <div class="need-row">
        <span class="need-label" style="font-size:10px;color:var(--text3)">без подарков и отменённых</span>
        <span></span>
      </div>
      <div class="need-row">
        <span class="need-label">Уже оплачено</span>
        <span class="need-val" style="color:var(--blue)">− ${fmtZ(s.paid)}</span>
      </div>
      <div class="need-row">
        <span class="need-label">Накоплено на счетах</span>
        <span class="need-val" style="color:var(--green)">− ${fmtZ(s.totalSav)}</span>
      </div>
      <div class="need-row" style="padding-top:10px">
        <span class="need-label" style="color:var(--text);font-size:13px">Ещё накопить</span>
        <span class="need-val" style="color:${s.deficit>0?'var(--red)':'var(--green)'};font-size:16px">${s.deficit>0?fmtZ(s.deficit):'Хватает'}</span>
      </div>
    </div>
    <div class="need-block">
      <div style="font-size:9px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px">Из накопленного зарезервировано</div>
      <div class="need-row">
        <span class="need-label">Накоплено</span>
        <span class="need-val" style="color:var(--green)">${fmtZ(s.totalSav)}</span>
      </div>
      <div class="need-row">
        <span class="need-label">${ic('lock',12)} Обязательства по договорам</span>
        <span class="need-val" style="color:var(--yellow)">− ${fmtZ(s.obligatedRemaining)}</span>
      </div>
      <div class="need-row" style="padding-top:10px">
        <span class="need-label" style="color:var(--text);font-size:13px">Свободно</span>
        <span class="need-val" style="color:${freeColor};font-size:16px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px">${fmtZ(Math.abs(s.freeAfterObligations))}${s.freeAfterObligations<0?ic('warn',13):''}</span>
      </div>
    </div>
    <div class="prog-bar" style="height:6px;margin-top:4px">
      <div class="prog-fill" style="width:${pct}%;background:var(--green)"></div>
    </div>
    <div style="text-align:right;font-size:10px;color:var(--text3);margin-top:4px">${pct}% бюджета собрано (накоп.+оплач.)</div>
  </div>

  <div class="savings-card">
    <div class="savings-title">Нужно откладывать</div>

function renderSyncStatus(){
  const cfg=getSyncCfg();
  if(!cfg.token||!cfg.repo){
    return `<div style="font-size:12px;color:var(--text3);line-height:1.5">Не настроена. Данные хранятся только на этом устройстве. Настройте синхронизацию, чтобы видеть их на всех устройствах.</div>`;
  }
  const last=cfg.lastSync?new Date(cfg.lastSync):null;
  const lastTxt=last?`${last.getDate().toString().padStart(2,'0')}.${(last.getMonth()+1).toString().padStart(2,'0')} ${last.getHours().toString().padStart(2,'0')}:${last.getMinutes().toString().padStart(2,'0')}`:'—';
  const st=syncState.status;
  const stColor=st==='ok'?'var(--green)':st==='error'?'var(--red)':st==='syncing'?'var(--yellow)':'var(--text3)';
  const stTxt=st==='ok'?'синхронизировано':st==='error'?('ошибка: '+(syncState.error||'')):st==='syncing'?'синхронизация…':'готово';
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div style="min-width:0">
        <div style="font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${cfg.repo}</div>
        <div style="font-size:10px;color:${stColor};margin-top:2px">${stTxt} · ${lastTxt}</div>
      </div>
      <button onclick="syncNow()" style="flex-shrink:0;display:flex;align-items:center;gap:5px;background:rgba(143,207,168,0.15);border:1px solid rgba(143,207,168,0.3);border-radius:8px;padding:6px 12px;color:var(--green);cursor:pointer;font-size:12px;font-family:inherit">${ic('check',13)} Синхр.</button>
    </div>`;
}

function buildSummaryHTML(item){
  const remainder=(+item.total||0)-(+item.paid||0);
  return`
    <div class="amt-row"><span class="amt-label">Плановая сумма</span><span class="amt-val" style="color:var(--gold)">${fmtZ(+item.planned)}</span></div>

    <div class="amt-row"><span class="amt-label">Оплачено</span><span class="amt-val" style="color:var(--green)">${fmt(+item.paid)}</span></div>
    <div class="amt-row"><span class="amt-label">Остаток к оплате</span><span class="amt-val" style="color:${remainder>0?'var(--yellow)':'var(--green)'}">${remainder>0?fmtZ(remainder):'—'}</span></div>`;
}
function refreshSummary(){const el=document.getElementById('amtSummary');if(el)el.innerHTML=buildSummaryHTML(modalItem);}

let newCatIcon='pin';
function onCatSelect(val){
  const wrap=document.getElementById('fCatNewWrap');
  if(val==='__new__'){
    wrap.style.display='block';
    document.getElementById('fCatNew').value='';
    modalItem.cat='';
    newCatIcon='pin';
    renderNewCatGrid();
    document.getElementById('fCatNew').focus();
    document.getElementById('mCat').textContent='Новая категория';
    document.getElementById('mIcon').innerHTML=ic('pin',22);
  } else {
    wrap.style.display='none';
    modalItem.cat=val;
    document.getElementById('mCat').textContent=val;
    document.getElementById('mIcon').innerHTML=ic(catIcon(val),22);
  }
}
function renderNewCatGrid(){
  const g=document.getElementById('newCatGrid');
  if(!g)return;
  g.innerHTML=PICKABLE_ICONS.map(o=>`<button onclick="pickNewCatIcon('${o}')" style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;font-family:inherit;border:1px solid ${newCatIcon===o?'var(--gold)':'rgba(217,189,110,0.15)'};background:${newCatIcon===o?'rgba(217,189,110,0.2)':'var(--bg3)'};color:${newCatIcon===o?'var(--gold)':'var(--text2)'}">${ic(o,18)}</button>`).join('');
}
function pickNewCatIcon(o){
  newCatIcon=o;
  renderNewCatGrid();
  document.getElementById('mIcon').innerHTML=ic(o,22);
}
function applyStatusUI(k){
  const sc=STATUS[k];
  document.getElementById('mIcon').style.background=sc.bg;
  document.getElementById('mIcon').style.color=sc.color;
  document.querySelectorAll('.status-btn').forEach((b,i)=>{
    const key=Object.keys(STATUS)[i];
    b.className='status-btn'+(key===k?' '+sc.cls:'');
  });
}
function setStatus(k){
  modalItem.status=k;
  modalItem._statusTouched=true;
  applyStatusUI(k);
}
function autoOnAmounts(){
  const t=+modalItem.total||0,p=+modalItem.paid||0;
  // авто-статус: договорная введена → Забронировано; оплачено = договорной → Оплачено
  if(!modalItem._statusTouched && modalItem.status!=='cancelled'){
    let ns;
    if(t>0&&p>=t)ns='paid';
    else if(t>0)ns='booked';
    else ns='planned';
    if(ns!==modalItem.status){modalItem.status=ns;applyStatusUI(ns);}
  }
  // авто-предоплата: 0 < оплачено < договорной → аванс
  if(!modalItem._prepayTouched){
    const np=(t>0&&p>0&&p<t);
    if(modalItem.isPrepay!==np){
      modalItem.isPrepay=np;
      const cb=document.getElementById('fPrepay');if(cb)cb.checked=np;
    }
  }
  refreshSummary();
}

function saveModal(){
  if(!modalItem)return;
  modalItem.name=document.getElementById('mTitleInput').value||modalItem.name;
  // новая категория из окна статьи → в общий свод со значком
  const ncWrap=document.getElementById('fCatNewWrap');
  if(ncWrap && ncWrap.style.display!=='none' && modalItem.cat && modalItem.cat.trim()){
    if(!state.catIcons)state.catIcons={};
    state.catIcons[modalItem.cat.trim()]=newCatIcon;
    modalItem.cat=modalItem.cat.trim();
  }
  delete modalItem._statusTouched;
  delete modalItem._prepayTouched;
  if(isNewItem){state.contractors.push(modalItem);state.nextId=(state.nextId||16)+1;}
  else{const idx=state.contractors.findIndex(c=>c.id===modalItem.id);if(idx>=0)state.contractors[idx]=modalItem;}
  save(state);closeModal();render();showToast('Сохранено');
}
function deleteItem(id){
  document.getElementById('mCat').textContent='Подтвердите удаление';
  document.getElementById('mBody').innerHTML=`
    <div style="font-size:13px;color:var(--text);line-height:1.5;margin-bottom:16px">Удалить эту статью? Действие необратимо.</div>
    <button class="btn-danger" style="margin-bottom:10px" onclick="doDeleteItem(${id})">${ic('close',15)} Да, удалить</button>
    <button class="btn-secondary" onclick="openModal(${id})">Отмена</button>
  `;
}
function doDeleteItem(id){
  state.contractors=state.contractors.filter(c=>c.id!==id);
  save(state);closeModal();render();showToast('Удалено');
}

function saveSavModal(){
  const label=document.getElementById('savLabel').value.trim()||'Источник';

  if(savModalId){const sv=state.savingsList.find(s=>s.id===savModalId);if(sv){if(sv.amount!==amount)changed=true;sv.label=label;sv.amount=amount;}}
  else{const newId='s'+(state.nextSavId||10);state.nextSavId=(state.nextSavId||10)+1;state.savingsList.push({id:newId,label,amount});changed=true;}
  if(changed)state.lastSavingsChange=new Date().toISOString();

function deleteSav(id){
  const sv=state.savingsList.find(s=>s.id===id);

    <button class="btn-primary" onclick="saveCategory(${isNew})">${ic('check',16,'#181c24')} Сохранить</button>
    <button class="btn-secondary" onclick="openCatManager()">Назад</button>
    ${(!isNew&&catEditOld)?`<button class="btn-danger" onclick="confirmDeleteCategory()">${ic('close',15)} Удалить${count?' ('+count+' стат. → Другое)':''}</button>`:''}
  `;
}
function pickCatIcon(ico){catEditIcon=ico;
  const name=document.getElementById('catNameInput').value;
  renderCatEditor(name,catEditOld==null);
}
function saveCategory(isNew){
  const newName=document.getElementById('catNameInput').value.trim();
  if(!newName){showToast('Введите название');return;}
  if(!state.catIcons)state.catIcons={};
  if(isNew){
    state.catIcons[newName]=catEditIcon;
    // создаём пустую категорию через статью-заглушку? нет — просто сохраняем иконку,
    // категория появится при назначении. Но чтобы была видна — добавим в список через catIcons.
  } else {
    if(newName!==catEditOld){
      state.contractors.forEach(c=>{if(c.cat===catEditOld)c.cat=newName;});
      if(state.filterCat===catEditOld)state.filterCat=newName;
      // перенос иконки
      delete state.catIcons[catEditOld];
    }
    state.catIcons[newName]=catEditIcon;
  }
  save(state);closeModal();render();showToast('Сохранено');
}
function confirmDeleteCategory(){
  const cat=catEditOld; if(!cat)return;
  const count=state.contractors.filter(c=>c.cat===cat).length;
  // инлайн-подтверждение без confirm()
  document.getElementById('mCat').textContent='Подтвердите удаление';
  document.getElementById('mBody').innerHTML=`
    <div style="font-size:13px;color:var(--text);line-height:1.5;margin-bottom:8px">Удалить категорию «${cat}»?</div>
    <div style="font-size:12px;color:var(--text3);line-height:1.5;margin-bottom:16px">${count?count+' статей будут перенесены в «Другое».':'Категория пустая.'}</div>
    <button class="btn-danger" style="margin-bottom:10px" onclick="doDeleteCategory()">${ic('close',15)} Да, удалить</button>
    <button class="btn-secondary" onclick="editCategory((window.__catList||[]).indexOf('${cat.replace(/'/g,"\\'")}'))">Отмена</button>
  `;
}
function doDeleteCategory(){
  const cat=catEditOld; if(!cat)return;
  state.contractors.forEach(c=>{if(c.cat===cat)c.cat='Другое';});
  if(state.filterCat===cat)state.filterCat='Все';
  if(state.catIcons)delete state.catIcons[cat];
  save(state);closeModal();render();showToast('Категория удалена');
}

// ── GITHUB SYNC ───────────────────────────────────────────
// Конфиг синхронизации хранится отдельно от данных (НЕ попадает в экспорт)
const SYNC_KEY='wedding_sync_cfg';
const DATA_PATH='wedding-data.json';
let syncState={status:'idle', error:'', sha:null, timer:null, pulling:false};

function getSyncCfg(){
  try{return JSON.parse(localStorage.getItem(SYNC_KEY))||{};}catch(e){return {};}
}
function setSyncCfg(c){localStorage.setItem(SYNC_KEY,JSON.stringify(c));}

function ghHeaders(token){
  return {'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
}

// GET текущего файла данных (вернёт {content, sha} или null если файла ещё нет)
async function ghGet(cfg){
  const url=`https://api.github.com/repos/${cfg.repo}/contents/${DATA_PATH}?ref=${cfg.branch||'main'}`;
  const r=await fetch(url,{headers:ghHeaders(cfg.token)});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('GET '+r.status);
  const j=await r.json();
  const content=decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))));
  return {content, sha:j.sha};
}

// PUT (создать/обновить) файл данных
async function ghPut(cfg, jsonStr, sha){
  const url=`https://api.github.com/repos/${cfg.repo}/contents/${DATA_PATH}`;
  const body={
    message:'update wedding data '+new Date().toISOString(),
    content:btoa(unescape(encodeURIComponent(jsonStr))),
    branch:cfg.branch||'main'
  };
  if(sha)body.sha=sha;
  const r=await fetch(url,{method:'PUT',headers:ghHeaders(cfg.token),body:JSON.stringify(body)});
  if(!r.ok){
    const t=await r.text();
    throw new Error('PUT '+r.status+(r.status===409?' (конфликт)':''));
  }
  const j=await r.json();
  return j.content.sha;
}

// Проверка доступа к репозиторию
async function ghTest(cfg){
  const url=`https://api.github.com/repos/${cfg.repo}`;
  const r=await fetch(url,{headers:ghHeaders(cfg.token)});
  if(r.status===401)throw new Error('неверный токен');
  if(r.status===404)throw new Error('репозиторий не найден или нет доступа');
  if(!r.ok)throw new Error('ошибка '+r.status);
  const j=await r.json();
  return j.permissions&&j.permissions.push;
}

// Загрузка данных из GitHub при старте (pull). Если на сервере новее — применяем.
async function syncPull(){
  const cfg=getSyncCfg();
  if(!cfg.token||!cfg.repo)return;
  syncState.pulling=true; setSyncStatus('syncing');
  try{
    const res=await ghGet(cfg);
    if(res){
      syncState.sha=res.sha;
      const remote=JSON.parse(res.content);
      // применяем удалённые данные, если они есть
      if(remote&&Array.isArray(remote.contractors)){
        state=normalizeData(Object.assign(clone(DEFAULT_DATA),remote));
        localStorage.setItem('wedding2026',JSON.stringify(state));
        if(typeof render==='function')render();
      }
    }
    cfg.lastSync=new Date().toISOString(); setSyncCfg(cfg);
    setSyncStatus('ok');
  }catch(e){
    setSyncStatus('error', e.message);
  }
  syncState.pulling=false;
}

// Отправка данных в GitHub (push) с защитой от конфликтов
async function syncPush(){
  const cfg=getSyncCfg();
  if(!cfg.token||!cfg.repo)return;
  setSyncStatus('syncing');
  try{
    // сначала узнаём актуальный sha (вдруг другое устройство обновило)
    let sha=syncState.sha;
    try{const cur=await ghGet(cfg); sha=cur?cur.sha:null;}catch(e){}
    const newSha=await ghPut(cfg, JSON.stringify(state), sha);
    syncState.sha=newSha;
    cfg.lastSync=new Date().toISOString(); setSyncCfg(cfg);
    setSyncStatus('ok');
  }catch(e){
    setSyncStatus('error', e.message);
  }
}

function setSyncStatus(st, err){
  syncState.status=st; syncState.error=err||'';
  const el=document.getElementById('syncStatus');
  if(el)el.innerHTML=renderSyncStatus();
}

// Ручная синхронизация: pull + push
async function syncNow(){
  const cfg=getSyncCfg();
  if(!cfg.token||!cfg.repo){openSyncSettings();return;}
  await syncPush();
  showToast(syncState.status==='ok'?'Синхронизировано':'Ошибка синхронизации');
}

// Автосохранение в GitHub с задержкой (debounce) — вызывается после save()
function scheduleSync(){
  const cfg=getSyncCfg();
  if(!cfg.token||!cfg.repo||syncState.pulling)return;
  if(syncState.timer)clearTimeout(syncState.timer);
  syncState.timer=setTimeout(()=>{syncPush();},2500);
}

// ── НАСТРОЙКИ СИНХРОНИЗАЦИИ (модалка) ──
function openSyncSettings(){
  const cfg=getSyncCfg();
  modalMode='sync';
  document.getElementById('mIcon').innerHTML=ic('source',22);
  document.getElementById('mIcon').style.color='var(--gold)';
  document.getElementById('mIcon').style.background='rgba(217,189,110,0.15)';
  document.getElementById('mTitleInput').value='Синхронизация';
  document.getElementById('mTitleInput').oninput=()=>{};
  document.getElementById('mCat').textContent='GitHub';
  document.getElementById('mBody').innerHTML=`
    <div style="font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:14px">
      Данные будут храниться в файле <b>${DATA_PATH}</b> в вашем репозитории и синхронизироваться между всеми устройствами. Токен хранится только на этом устройстве.
    </div>
    <div class="field-group">
      <label class="field-label">Репозиторий (логин/название)</label>
      <input class="field-input" id="syncRepo" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" value="${cfg.repo||''}" placeholder="username/wedding">
    </div>
    <div class="field-group">
      <label class="field-label">Ветка</label>
      <input class="field-input" id="syncBranch" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" value="${cfg.branch||'main'}" placeholder="main">
    </div>
    <div class="field-group">
      <label class="field-label">Токен доступа (Personal Access Token)</label>
      <input class="field-input" id="syncToken" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" value="${cfg.token||''}" placeholder="github_pat_...">
      <div style="font-size:10px;color:var(--text3);margin-top:6px;line-height:1.5">
        Создать: GitHub → Settings → Developer settings → Fine-grained tokens. Доступ: только нужный репозиторий, право <b>Contents: Read and write</b>. Инструкция в README.
      </div>
    </div>
    <button class="btn-primary" onclick="saveSyncSettings()">${ic('check',16,'#181c24')} Подключить и загрузить</button>
    <button class="btn-secondary" onclick="closeModal()">Отмена</button>
    ${cfg.token?`<button class="btn-danger" onclick="disconnectSync()">${ic('close',15)} Отключить синхронизацию</button>`:''}
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

async function saveSyncSettings(){
  const repo=document.getElementById('syncRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'');
  const branch=document.getElementById('syncBranch').value.trim()||'main';
  const token=document.getElementById('syncToken').value.trim();
  if(!repo||!token){showToast('Заполните репозиторий и токен');return;}
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){showToast('Формат: логин/репозиторий');return;}
  const cfg={repo,branch,token,lastSync:null};
  setSyncStatus('syncing');
  try{
    const canPush=await ghTest(cfg);
    if(!canPush){setSyncStatus('error','нет прав на запись');showToast('Токен без права записи');return;}
    setSyncCfg(cfg);
    // тянем данные с сервера; если их нет — заливаем текущие
    const res=await ghGet(cfg);
    if(res){
      syncState.sha=res.sha;
      const remote=JSON.parse(res.content);
      if(remote&&Array.isArray(remote.contractors)){
        // на сервере уже есть данные — спрашиваем что делать
        closeModal();
        openSyncMergeChoice(remote);
        return;
      }
    }
    // на сервере пусто — заливаем локальные
    await syncPush();
    closeModal();render();
    showToast('Синхронизация подключена');
  }catch(e){
    setSyncStatus('error', e.message);
    showToast('Ошибка: '+e.message);
  }
}

// Выбор при конфликте: на сервере уже есть данные
function openSyncMergeChoice(remote){
  modalMode='syncmerge';
  document.getElementById('mIcon').innerHTML=ic('warn',22);
  document.getElementById('mIcon').style.color='var(--yellow)';
  document.getElementById('mIcon').style.background='rgba(230,200,120,0.15)';
  document.getElementById('mTitleInput').value='Данные найдены';
  document.getElementById('mTitleInput').oninput=()=>{};
  document.getElementById('mCat').textContent='Выбор источника';
  window.__remoteData=remote;
  const rc=Array.isArray(remote.contractors)?remote.contractors.length:0;
  const lc=state.contractors.length;
  document.getElementById('mBody').innerHTML=`
    <div style="font-size:13px;color:var(--text);line-height:1.5;margin-bottom:8px">В репозитории уже есть сохранённые данные.</div>
    <div style="font-size:12px;color:var(--text3);line-height:1.6;margin-bottom:16px">На сервере: ${rc} статей · На этом устройстве: ${lc} статей. Что использовать?</div>
    <button class="btn-primary" onclick="syncUseRemote()">${ic('source',15,'#181c24')} Загрузить из GitHub (заменить локальные)</button>
    <button class="btn-secondary" onclick="syncUseLocal()">${ic('wallet',15)} Залить локальные в GitHub (заменить на сервере)</button>
    <button class="btn-secondary" onclick="closeModal()">Отмена</button>
  `;
  document.getElementById('modalOverlay').classList.add('open');
}
async function syncUseRemote(){
  const remote=window.__remoteData;
  state=normalizeData(Object.assign(clone(DEFAULT_DATA),remote));
  localStorage.setItem('wedding2026',JSON.stringify(state));
  const cfg=getSyncCfg();cfg.lastSync=new Date().toISOString();setSyncCfg(cfg);
  setSyncStatus('ok');closeModal();switchTab('dashboard');showToast('Загружено из GitHub');
}
async function syncUseLocal(){
  await syncPush();
  closeModal();render();showToast('Залито в GitHub');
}

function disconnectSync(){
  localStorage.removeItem(SYNC_KEY);
  syncState={status:'idle',error:'',sha:null,timer:null,pulling:false};
  closeModal();render();showToast('Синхронизация отключена');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

// ── SWIPE TO CLOSE MODAL ──────────────────────────────────
(function(){
  const modal=document.getElementById('modal');
  const grab=document.getElementById('modalGrab');
  let startY=0, curY=0, dragging=false, fromGrab=false;

  function start(e){
    const t=e.touches?e.touches[0]:e;
    startY=t.clientY; curY=0;
    // тянуть можно либо за «ручку», либо когда контент проскроллен в самый верх
    fromGrab=(e.currentTarget===grab);
    if(fromGrab || modal.scrollTop<=0){
      dragging=true;
      modal.classList.add('dragging');
    }
  }
  function move(e){
    if(!dragging)return;
    const t=e.touches?e.touches[0]:e;
    const dy=t.clientY-startY;
    // если тянем вниз — двигаем окно; вверх — отдаём прокрутке
    if(dy>0 && (fromGrab || modal.scrollTop<=0)){
      curY=dy;
      modal.style.transform='translateY('+dy+'px)';
      if(e.cancelable)e.preventDefault();
    } else {
      // ушли в обычный скролл — прекращаем перетаскивание
      dragging=false;
      modal.classList.remove('dragging');
      modal.style.transform='';
    }
  }
  function end(){
    if(!dragging)return;
    dragging=false;
    modal.classList.remove('dragging');
    modal.style.transform='';
    if(curY>110){ closeModal(); }
    curY=0;
  }

  grab.addEventListener('touchstart',start,{passive:true});
  modal.addEventListener('touchstart',start,{passive:true});
  modal.addEventListener('touchmove',move,{passive:false});
  modal.addEventListener('touchend',end);
  modal.addEventListener('touchcancel',end);
})();
